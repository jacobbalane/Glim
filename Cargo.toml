[workspace]
members = ["crates/glim-core", "hook-relay", "desktop/src-tauri"]
resolver = "2"

[workspace.package]
license = "MIT"
repository = "https://github.com/jacobbalane/Glim"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.37"
directories = "6"

[profile.release]
lto = "thin"
strip = true
