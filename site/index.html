<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glim: a glimpse at your agents</title>
    <meta
      name="description"
      content="Glim sits at the top of your Windows screen and shows what Claude Code and Codex are doing, so you can stay in your own work. Free, open source and local."
    />
    <meta property="og:title" content="Glim: a glimpse at your agents" />
    <meta
      property="og:description"
      content="A live status island for Claude Code and Codex on Windows. Free, open source and local."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0a0a0f" />
    <!-- The 3D Glim, rendered by scripts/render-brand.mjs (the same file the app uses). -->
    <link rel="icon" href="/favicon.png" type="image/png" />
  </head>
  <body>
    <!--
      THESIS: The browser window is the screen. Glim hangs live from its top edge, so a visitor
      uses the product before reading about it. Refuses the category default: a dark gradient
      hero, a laptop screenshot and a grid of feature cards.
      OWN-WORLD: The preview-claude review page at landing scale. #f1f1f3 ground, desk gradients,
      hairlines, one face (Manrope Variable), ink #18181b. Color comes only from the product: the
      black island with its state colors, and the Glim indigo mark. Bold by scale: 96px/800
      display at -0.04em, indigo pill buttons, a 3px black screen edge across the top.
      STORY: See agents working in the notch, fire an approval and watch it take over, open it,
      learn it stays local, download it for Windows 11.
      FIRST VIEWPORT: The black edge with the live island hanging from its center (fixed while
      scrolling). Mark and wordmark top left, GitHub and Download top right. Centered under the
      island: the two-line headline, one sentence, the indigo Download pill with a GitHub link,
      then a quiet "Try it" row of agent events.
      FORM: Product-as-hero landing page, a whole surface inside the established preview-claude
      world (pinned by the owner), so no concept roll.
      FINISH: two inspection rounds on desktop and mobile, then the detector.
    -->
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
