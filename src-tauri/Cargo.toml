[package]
name = "glim"
version = "0.1.3"
description = "A little island for your local coding agents"
authors = ["Glim contributors"]
license = "MIT"
edition = "2021"
default-run = "glim"

[lib]
name = "glim_lib"
crate-type = ["lib"]

[[bin]]
name = "glim"
path = "src/main.rs"

[[bin]]
name = "glim-bridge"
path = "src/bin/bridge.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: agent settings keep their own key order when Glim adds and removes its hooks.
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.38", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
